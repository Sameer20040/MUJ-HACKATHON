# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# # - See: https://alembic.sqlalchemy.org/en/latest/tutorial.html#creating-migration-scripts
# # TODO: Consider using a custom template if the default doesn't suit your needs.
# # For now, we use the default.
# # template = %(here)s/%(name)s.py

# The set of tables marked as 'autogenerate' include
# tables = all

# sqlalchemy.url will be overridden by the environment variable DATABASE_URL
# or the value in src.config.settings.DATABASE_URL
# We'll set it to a dummy value here, and override it at runtime.
sqlalchemy.url = driver://user:pass@localhost:5432/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s