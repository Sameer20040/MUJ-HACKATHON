[theme]
base = "dark"
primaryColor = "#1769aa"
backgroundColor = "#07111d"
secondaryBackgroundColor = "#0d1b2a"
textColor = "#ecf6ff"
borderColor = "#24445f"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["32px", "25px", "21px", "18px", "16px", "14px"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
chartCategoricalColors = ["#5dade2", "#58d68d", "#f4d03f", "#ec7063", "#bb8fce"]
blueColor = "#5dade2"
greenColor = "#58d68d"
yellowColor = "#f4d03f"
redColor = "#ec7063"
linkUnderline = false

[theme.sidebar]
backgroundColor = "#091522"
secondaryBackgroundColor = "#10263a"
textColor = "#ecf6ff"
borderColor = "#24445f"

[client]
toolbarMode = "minimal"
